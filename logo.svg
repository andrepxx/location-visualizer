<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">

	<!-- Background -->
	<rect width="100%" height="100%" fill="#0d1117" rx="20"/>

	<!-- === GPS SATELLITE === -->
	<g transform="translate(420, 75) rotate(45)">
		<!-- Left solar panels -->
		<path d="M -55,-12 H -25 V 12 H -55 Z" fill="#1f6feb" stroke="#58a6ff" stroke-width="1.5" stroke-linejoin="round"/>
		<line x1="-40" y1="-12" x2="-40" y2="12" stroke="#58a6ff" stroke-width="1"/>
		<!-- Right solar panels -->
		<path d="M 25,-12 H 55 V 12 H 25 Z" fill="#1f6feb" stroke="#58a6ff" stroke-width="1.5" stroke-linejoin="round"/>
		<line x1="40" y1="-12" x2="40" y2="12" stroke="#58a6ff" stroke-width="1"/>
		<!-- Central grid connectors -->
		<line x1="-25" y1="0" x2="25" y2="0" stroke="#58a6ff" stroke-width="3"/>
		<!-- Satellite main chassis -->
		<rect x="-14" y="-14" width="28" height="28" rx="3" fill="#161b22" stroke="#ffffff" stroke-width="2"/>
		<!-- Instrument details on chassis -->
		<circle cx="0" cy="0" r="6" fill="#3081f7" stroke="#58a6ff" stroke-width="1"/>
		<!-- Transmitting antenna dish -->
		<path d="M -8,14 Q 0,26 8,14 Z" fill="#161b22" stroke="#ffffff" stroke-width="1.5"/>
		<line x1="0" y1="20" x2="0" y2="28" stroke="#ffffff" stroke-width="1.5"/>
		<circle cx="0" cy="29" r="2" fill="#10b981"/>
		<!-- Waves indicating transmission towards the map plane -->
		<path d="M -15,42 Q 0,50 15,42" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
		<path d="M -25,52 Q 0,62 25,52" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>
	</g>

	<!-- === MAP SURFACE === -->

	<!-- Map base plate (lying flat) -->
	<polygon points="154,230 346,230 474,350 26,350" fill="#161b22" stroke="#3081f7" stroke-width="3"/>
	<!-- Perspective coordinate grid lines -->
	<!-- Longitudinal (vertical depth) grid lines -->
	<path d="M 178,230 L 82,350" stroke="#21262d" stroke-width="1.5"/>
	<path d="M 214,230 L 166,350" stroke="#21262d" stroke-width="1.5"/>
	<path d="M 250,230 L 250,350" stroke="#21262d" stroke-width="2" stroke-opacity="0.5"/>
	<!-- Center Axis -->
	<path d="M 286,230 L 334,350" stroke="#21262d" stroke-width="1.5"/>
	<path d="M 322,230 L 418,350" stroke="#21262d" stroke-width="1.5"/>
	<!-- Latitudinal (horizontal) grid lines -->
	<path d="M 138,245 L 362,245" stroke="#21262d" stroke-width="1.5"/>
	<path d="M 106,272 L 394,272" stroke="#21262d" stroke-width="1.5"/>
	<path d="M 74,300 L 426,300" stroke="#21262d" stroke-width="1.5"/>
	<path d="M 42,327 L 458,327" stroke="#21262d" stroke-width="1.5"/>

	<!-- === MICROCHIP === -->
	<!-- Shifted further up and into the map grid (to 130, 310) away from margins and lower edge -->
	<g transform="translate(130, 310)">
		<!-- Base body -->
		<rect x="-18" y="-18" width="36" height="36" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
		<!-- Silicon die -->
		<rect x="-8" y="-8" width="16" height="16" rx="2" fill="#0d1117" stroke="#3081f7" stroke-width="1.5"/>
		<circle cx="0" cy="0" r="3" fill="#10b981"/>
		<!-- Outer pins -->
		<path d="M -24,-10 H -18 M -24,-3 H -18 M -24,4 H -18 M -24,11 H -18" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
		<path d="M 18,-10 H 24 M 18,-3 H 24 M 18,4 H 24 M 18,11 H 24" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
		<path d="M -10,-24 V -18 M -3,-24 V -18 M 4,-24 V -18 M 11,-24 V -18" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
		<path d="M -10,18 V 24 M -3,18 V 24 M 4,18 V 24 M 11,18 V 24" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
	</g>

	<!-- === ROUTE / TRACK === -->
	<!-- Starting point at the microchip location (130, 310) -->
	<path d="M 130,310 Q 190,260 250,295 T 350,250" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8,6" stroke-linecap="round"/>
	<!-- Coordinate waypoints (markers) -->
	<!-- Waypoint 1 (midpoint) -->
	<g transform="translate(195, 282)">
		<path d="M -5,-5 L 5,5 M -5,5 L 5,-5" stroke="#f43f5e" stroke-width="2"/>
	</g>
	<!-- Waypoint 2 (end segment) -->
	<g transform="translate(350, 250)">
		<path d="M -6,-6 L 6,6 M -6,6 L 6,-6" stroke="#f43f5e" stroke-width="2.5"/>
	</g>

	<!-- === HOVERING PIN AND SHIELD === -->
	<!-- Target spot shadow (ground anchor) -->
	<ellipse cx="250" cy="295" rx="14" ry="6" fill="#000000" opacity="0.7"/>
	<ellipse cx="250" cy="295" rx="7" ry="3" fill="none" stroke="#10b981" stroke-width="2"/>
	<!-- Vertical indicator line -->
	<line x1="250" y1="295" x2="250" y2="105" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
	<!-- Lifted up to y=105 to accomodate space between map rear edge (y=230) and shield bottom edge (y=195) -->
	<g transform="translate(250, 105) scale(0.75)">
		<!-- Security shield background glow -->
		<path d="M 0,-60 C 35,-60 65,-48 75,-35 C 75,30 45,90 0,120 C -45,90 -75,30 -75,-35 C -65,-48 -35,-60 0,-60 Z" fill="#3081f7" fill-opacity="0.12" stroke="#3081f7" stroke-width="5" stroke-linejoin="round"/>
		<!-- Location indicator / pin -->
		<path d="M 0,-40 C 22,-40 35,-22 35,0 C 35,30 0,70 0,70 C 0,70 -35,30 -35,0 C -35,-22 -22,-40 0,-40 Z" fill="#ffffff" stroke="#10b981" stroke-width="6" stroke-linejoin="round"/>
		<!-- Center cutout in map pin -->
		<circle cx="0" cy="0" r="11" fill="#3081f7" stroke="#3081f7"/>
		<circle cx="0" cy="0" r="5" fill="#ffffff"/>
		<!-- Security lock, positioned slightly to the bottom right of the shield -->
		<g transform="translate(60, 100)">
			<!-- Lock Shackle -->
			<path d="M -5,-3 V -8 C -5,-11 -2,-13 1,-13 C 4,-13 7,-11 7,-8 V -3" fill="none" stroke="#3081f7" stroke-width="2.5" stroke-linecap="round"/>
			<!-- Lock Body -->
			<rect x="-9" y="-3" width="20" height="15" rx="3" fill="#3081f7"/>
			<!-- Keyhole Dot -->
			<circle cx="1" cy="3" r="2" fill="#0d1117"/>
		</g>
	</g>

	<!-- === TYPOGRAPHY === -->
	<text x="250" y="445" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="3">
		LOCATION-VISUALIZER
	</text>
</svg>
