<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="640"
     viewBox="0 0 1280 640">

  <title>location-visualizer — Location and activity data analysis</title>

  <desc>
    Social preview for location-visualizer.
    Location and activity data analysis on your own infrastructure.
  </desc>

  <defs>

    <!-- =========================================================
         BACKGROUND
         ========================================================= -->

    <linearGradient id="background"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101820"/>
    </linearGradient>

    <radialGradient id="blueGlow"
                    cx="72%" cy="48%" r="55%">
      <stop offset="0%"
            stop-color="#1f6feb"
            stop-opacity="0.16"/>
      <stop offset="100%"
            stop-color="#1f6feb"
            stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="mapClip">
      <rect x="520" y="80"
            width="690" height="420"
            rx="20"/>
    </clipPath>

  </defs>


  <!-- =========================================================
       CANVAS
       ========================================================= -->

  <rect width="1280"
        height="640"
        fill="url(#background)"/>

  <rect width="1280"
        height="640"
        fill="url(#blueGlow)"/>


  <!-- =========================================================
       SUBTLE TECHNICAL GRID
       ========================================================= -->

  <g stroke="#58a6ff"
     stroke-width="1"
     opacity="0.055">

    <path d="M 0 80 H 1280"/>
    <path d="M 0 160 H 1280"/>
    <path d="M 0 240 H 1280"/>
    <path d="M 0 320 H 1280"/>
    <path d="M 0 400 H 1280"/>
    <path d="M 0 480 H 1280"/>
    <path d="M 0 560 H 1280"/>

    <path d="M 80 0 V 640"/>
    <path d="M 160 0 V 640"/>
    <path d="M 240 0 V 640"/>
    <path d="M 320 0 V 640"/>
    <path d="M 400 0 V 640"/>
    <path d="M 480 0 V 640"/>
    <path d="M 560 0 V 640"/>
    <path d="M 640 0 V 640"/>
    <path d="M 720 0 V 640"/>
    <path d="M 800 0 V 640"/>
    <path d="M 880 0 V 640"/>
    <path d="M 960 0 V 640"/>
    <path d="M 1040 0 V 640"/>
    <path d="M 1120 0 V 640"/>
    <path d="M 1200 0 V 640"/>

  </g>


  <!-- =========================================================
       SIMPLIFIED LOGO MARK
       ========================================================= -->

  <g transform="translate(80, 100)">

    <rect x="0" y="0"
          width="300"
          height="300"
          rx="28"
          fill="#0d1117"
          stroke="#21262d"
          stroke-width="2"/>


    <!-- =======================================================
         SATELLITE + GNSS TRANSMISSION
         ======================================================= -->

    <g transform="translate(202, 82) rotate(45)">


      <!-- =====================================================
           GNSS WAVE PACKET

           The wave centre is exactly at the antenna dot (0,42).
           The packet uses true circular arcs.

           The 90 degree local rotation, combined with the
           satellite's 45 degree rotation, gives the desired
           final orientation.
           ===================================================== -->

      <g transform="translate(0, 42) rotate(90)"
         fill="none"
         stroke="#10b981"
         stroke-linecap="round">

        <path d="M 18,-7.45
                 A 18,18 0 0 1 18,7.45"
              stroke-width="2"
              opacity="0.55"/>

        <path d="M 38,-15.72
                 A 38,38 0 0 1 38,15.72"
              stroke-width="2"
              opacity="0.30"/>

        <path d="M 58,-24
                 A 58,58 0 0 1 58,24"
              stroke-width="2"
              opacity="0.15"/>

      </g>


      <!-- =====================================================
           SOLAR PANELS
           ===================================================== -->

      <rect x="-78" y="-16"
            width="42"
            height="32"
            rx="2"
            fill="#1f6feb"
            stroke="#58a6ff"
            stroke-width="2"/>

      <line x1="-57" y1="-16"
            x2="-57" y2="16"
            stroke="#58a6ff"
            stroke-width="1.5"/>

      <rect x="36" y="-16"
            width="42"
            height="32"
            rx="2"
            fill="#1f6feb"
            stroke="#58a6ff"
            stroke-width="2"/>

      <line x1="57" y1="-16"
            x2="57" y2="16"
            stroke="#58a6ff"
            stroke-width="1.5"/>


      <!-- =====================================================
           CENTRAL CONNECTOR
           ===================================================== -->

      <line x1="-36" y1="0"
            x2="36" y2="0"
            stroke="#58a6ff"
            stroke-width="4"/>


      <!-- =====================================================
           SATELLITE CHASSIS
           ===================================================== -->

      <rect x="-21" y="-21"
            width="42"
            height="42"
            rx="5"
            fill="#161b22"
            stroke="#ffffff"
            stroke-width="2.5"/>

      <circle cx="0" cy="0"
              r="9"
              fill="#3081f7"
              stroke="#58a6ff"
              stroke-width="1.5"/>


      <!-- =====================================================
           ANTENNA
           ===================================================== -->

      <path d="M -11,21
               Q 0,37 11,21"
            fill="#161b22"
            stroke="#ffffff"
            stroke-width="2"/>

      <line x1="0" y1="30"
            x2="0" y2="40"
            stroke="#ffffff"
            stroke-width="2"/>

      <!-- Exact centre of the GNSS wave packet -->
      <circle cx="0" cy="42"
              r="3"
              fill="#10b981"/>

    </g>


    <!-- =======================================================
         LOCATION PIN
         ======================================================= -->

    <g transform="translate(82, 211) scale(0.62)">

      <circle cx="0" cy="-8"
              r="62"
              fill="#3081f7"
              opacity="0.07"
              filter="url(#softGlow)"/>

      <path d="
        M 0,-58
        C 31,-58 50,-36 50,-8
        C 50,28 0,82 0,82
        C 0,82 -50,28 -50,-8
        C -50,-36 -31,-58 0,-58
        Z"
        fill="#ffffff"
        stroke="#10b981"
        stroke-width="7"
        stroke-linejoin="round"/>

      <circle cx="0"
              cy="-8"
              r="15"
              fill="#3081f7"/>

      <circle cx="0"
              cy="-8"
              r="7"
              fill="#ffffff"/>

    </g>


    <!-- =======================================================
         GROUND ACCENT
         ======================================================= -->

    <g transform="translate(82, 271) scale(0.50)">

      <ellipse cx="0"
               cy="0"
               rx="35"
               ry="9"
               fill="#000000"
               opacity="0.45"/>

      <ellipse cx="0"
               cy="0"
               rx="18"
               ry="4"
               fill="none"
               stroke="#10b981"
               stroke-width="1.5"
               opacity="0.5"/>

    </g>

  </g>


  <!-- =========================================================
       PROJECT IDENTITY
       ========================================================= -->

  <text x="430"
        y="158"
        fill="#ffffff"
        font-family="-apple-system, BlinkMacSystemFont,
                     'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52"
        font-weight="700"
        letter-spacing="0.5">
    location-visualizer
  </text>

  <text x="432"
        y="208"
        fill="#8b949e"
        font-family="-apple-system, BlinkMacSystemFont,
                     'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25">
    Location and activity data analysis
  </text>

  <text x="432"
        y="243"
        fill="#8b949e"
        font-family="-apple-system, BlinkMacSystemFont,
                     'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="25">
    on your own infrastructure.
  </text>

  <rect x="432"
        y="273"
        width="210"
        height="3"
        rx="1.5"
        fill="#10b981"/>


  <!-- =========================================================
       DECORATIVE MAP / TRACK
       ========================================================= -->

  <g clip-path="url(#mapClip)">

    <!-- Map grid -->
    <g fill="none"
       stroke="#1f6feb"
       stroke-width="1"
       opacity="0.22">

      <path d="M 470 125 H 1260"/>
      <path d="M 450 180 H 1280"/>
      <path d="M 425 240 H 1300"/>
      <path d="M 400 310 H 1320"/>
      <path d="M 370 390 H 1340"/>
      <path d="M 330 480 H 1360"/>

      <path d="M 600 70 L 470 520"/>
      <path d="M 700 70 L 650 520"/>
      <path d="M 800 70 L 800 520"/>
      <path d="M 900 70 L 950 520"/>
      <path d="M 1000 70 L 1100 520"/>
      <path d="M 1100 70 L 1250 520"/>
      <path d="M 1200 70 L 1400 520"/>

    </g>


    <!-- =======================================================
         ROUTE GLOW
         ======================================================= -->

    <path d="
      M 470,445
      C 540,395 575,320 650,355
      C 720,388 745,445 820,395
      C 900,342 905,250 980,275
      C 1040,295 1060,355 1110,330
      C 1165,302 1165,225 1240,205
    "
    fill="none"
    stroke="#10b981"
    stroke-width="12"
    opacity="0.15"
    filter="url(#softGlow)"/>


    <!-- =======================================================
         ROUTE
         ======================================================= -->

    <path d="
      M 470,445
      C 540,395 575,320 650,355
      C 720,388 745,445 820,395
      C 900,342 905,250 980,275
      C 1040,295 1060,355 1110,330
      C 1165,302 1165,225 1240,205
    "
    fill="none"
    stroke="#10b981"
    stroke-width="3"
    stroke-dasharray="12 9"
    stroke-linecap="round"/>


    <!-- =======================================================
         WAYPOINTS
         ======================================================= -->

    <g fill="#f43f5e">

      <circle cx="650"
              cy="355"
              r="5"/>

      <circle cx="820"
              cy="395"
              r="5"/>

      <circle cx="980"
              cy="275"
              r="5"/>

      <circle cx="1110"
              cy="330"
              r="5"/>

    </g>

  </g>


  <!-- =========================================================
       KEYWORD TAGS
       ========================================================= -->

  <g transform="translate(430, 365)"
     font-family="-apple-system, BlinkMacSystemFont,
                  'Segoe UI', Helvetica, Arial, sans-serif"
     font-size="16"
     font-weight="600"
     letter-spacing="1">


    <!-- SELF-HOSTED -->
    <g transform="translate(0, 0)">

      <rect x="0" y="0"
            width="137"
            height="38"
            rx="19"
            fill="#000000"
            fill-opacity="0.50"
            stroke="#58a6ff"
            stroke-opacity="0.18"/>

      <text x="68.5"
            y="24"
            text-anchor="middle"
            fill="#58a6ff">
        SELF-HOSTED
      </text>

    </g>


    <!-- GIS -->
    <g transform="translate(151, 0)">

      <rect x="0" y="0"
            width="67"
            height="38"
            rx="19"
            fill="#000000"
            fill-opacity="0.50"
            stroke="#8b949e"
            stroke-opacity="0.12"/>

      <text x="33.5"
            y="24"
            text-anchor="middle"
            fill="#8b949e">
        GIS
      </text>

    </g>


    <!-- GNSS -->
    <g transform="translate(232, 0)">

      <rect x="0" y="0"
            width="83"
            height="38"
            rx="19"
            fill="#000000"
            fill-opacity="0.50"
            stroke="#8b949e"
            stroke-opacity="0.12"/>

      <text x="41.5"
            y="24"
            text-anchor="middle"
            fill="#8b949e">
        GNSS
      </text>

    </g>


    <!-- OPENSTREETMAP -->
    <g transform="translate(329, 0)">

      <rect x="0" y="0"
            width="175"
            height="38"
            rx="19"
            fill="#000000"
            fill-opacity="0.50"
            stroke="#8b949e"
            stroke-opacity="0.12"/>

      <text x="87.5"
            y="24"
            text-anchor="middle"
            fill="#8b949e">
        OPENSTREETMAP
      </text>

    </g>


    <!-- DATA-SCIENCE -->
    <g transform="translate(518, 0)">

      <rect x="0" y="0"
            width="153"
            height="38"
            rx="19"
            fill="#000000"
            fill-opacity="0.50"
            stroke="#8b949e"
            stroke-opacity="0.12"/>

      <text x="76.5"
            y="24"
            text-anchor="middle"
            fill="#8b949e">
        DATA-SCIENCE
      </text>

    </g>

  </g>


  <!-- =========================================================
       GITHUB / PROJECT METADATA
       ========================================================= -->

  <g transform="translate(430, 455)"
     font-family="-apple-system, BlinkMacSystemFont,
                  'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="0"
          y="0"
          fill="#ffffff"
          font-size="20"
          font-weight="600">
      ★ {{stars}}
    </text>

    <text x="125"
          y="0"
          fill="#ffffff"
          font-size="20"
          font-weight="600">
      ⑂ {{forks}}
    </text>

    <text x="245"
          y="0"
          fill="#8b949e"
          font-size="20">
      {{version}}
    </text>

  </g>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <line x1="430"
        y1="500"
        x2="1210"
        y2="500"
        stroke="#21262d"
        stroke-width="1"/>

  <text x="430"
        y="535"
        fill="#484f58"
        font-family="-apple-system, BlinkMacSystemFont,
                     'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15"
        letter-spacing="0.5">
    github.com/andrepxx/location-visualizer
  </text>

</svg>

